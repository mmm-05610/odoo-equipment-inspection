name: inspection_public
services:
  db:
    image: inspection-postgres:15
    build:
      context: .
      dockerfile: deploy/Postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?required}
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 350m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '2'}
  web:
    image: inspection-public:19.0.1.3
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?required}
      DEMO_ORIGIN: ${DEMO_ORIGIN:?required}
    volumes:
      - ./.runtime/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    ports: ['${ODOO_BIND_IP:-127.0.0.1}:8076:8069']
    command: ['odoo', '-d', 'inspection_demo', '--db-filter=^inspection_demo$$', '--no-database-list', '--proxy-mode', '--workers=0', '--max-cron-threads=0']
    mem_limit: 1100m
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '2'}
volumes:
  db-data:
  odoo-data:
